<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1300" height="640" fill="#ffffff"/>

  <text x="40" y="32" font-size="22" font-weight="700" fill="#1a1a1a">EPFO Payroll Analytics — Report Wireframe (5 pages)</text>
  <text x="40" y="52" font-size="13" fill="#666666">Low-fidelity plan, built before the pages themselves — Phase 4 blueprint</text>

  <!-- ===================== PAGE 1: Overview ===================== -->
  <g transform="translate(40,80)">
    <text x="0" y="-8" font-size="14" font-weight="700" fill="#1a1a1a">1. Overview</text>
    <rect x="0" y="0" width="380" height="214" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
    <!-- KPI row -->
    <g fill="#e8e8e8" stroke="#999999" stroke-dasharray="3,2">
      <rect x="10" y="10" width="84" height="46"/>
      <rect x="102" y="10" width="84" height="46"/>
      <rect x="194" y="10" width="84" height="46"/>
      <rect x="286" y="10" width="84" height="46"/>
    </g>
    <g font-size="9" fill="#444444" text-anchor="middle">
      <text x="52" y="30">Latest Month</text><text x="52" y="42">Net Payroll</text>
      <text x="144" y="30">MoM %</text><text x="144" y="42">Change</text>
      <text x="236" y="30">YoY %</text><text x="236" y="42">Change</text>
      <text x="328" y="30">All-Time</text><text x="328" y="42">High Flag</text>
    </g>
    <!-- Smart narrative -->
    <rect x="10" y="64" width="360" height="48" fill="#eef2f7" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="20" y="82" font-size="9" fill="#444444">Smart Narrative — auto-generated</text>
    <text x="20" y="95" font-size="9" fill="#444444">summary of latest trend + drivers</text>
    <!-- sparkline -->
    <rect x="10" y="120" width="360" height="84" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <polyline points="20,180 60,165 100,175 140,150 180,160 220,120 260,140 300,110 340,130" fill="none" stroke="#3b6ea5" stroke-width="2"/>
    <text x="20" y="134" font-size="9" fill="#444444">Mini trend sparkline (Net Payroll, all months)</text>
  </g>

  <!-- ===================== PAGE 2: Trend ===================== -->
  <g transform="translate(460,80)">
    <text x="0" y="-8" font-size="14" font-weight="700" fill="#1a1a1a">2. Trend</text>
    <rect x="0" y="0" width="380" height="214" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
    <!-- slicers -->
    <g fill="#dfe7f0" stroke="#999999">
      <rect x="10" y="10" width="110" height="20"/>
      <rect x="128" y="10" width="110" height="20"/>
    </g>
    <text x="65" y="24" font-size="9" text-anchor="middle" fill="#444444">Slicer: Fiscal Year</text>
    <text x="183" y="24" font-size="9" text-anchor="middle" fill="#444444">Slicer: Age Band</text>
    <!-- main line chart -->
    <rect x="10" y="38" width="360" height="120" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="20" y="52" font-size="9" fill="#444444">Line chart — Net Payroll + Rolling 3M Avg (overlay)</text>
    <polyline points="20,150 60,120 100,140 140,90 180,70 220,110 260,60 300,80 340,50" fill="none" stroke="#3b6ea5" stroke-width="2"/>
    <polyline points="20,145 60,135 100,132 140,118 180,100 220,102 260,90 300,85 340,75" fill="none" stroke="#c0793b" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- small KPI strip -->
    <g fill="#e8e8e8" stroke="#999999" stroke-dasharray="3,2">
      <rect x="10" y="164" width="176" height="40"/>
      <rect x="194" y="164" width="176" height="40"/>
    </g>
    <text x="98" y="188" font-size="9" text-anchor="middle" fill="#444444">MoM % (card)</text>
    <text x="282" y="188" font-size="9" text-anchor="middle" fill="#444444">YoY % (card)</text>
  </g>

  <!-- ===================== PAGE 3: Age-Band Breakdown ===================== -->
  <g transform="translate(880,80)">
    <text x="0" y="-8" font-size="14" font-weight="700" fill="#1a1a1a">3. Age-Band Breakdown</text>
    <rect x="0" y="0" width="380" height="214" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
    <!-- decomposition tree -->
    <rect x="10" y="10" width="176" height="194" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="20" y="26" font-size="9" fill="#444444">Decomposition Tree</text>
    <text x="20" y="38" font-size="9" fill="#444444">Total → AgeBand → Month</text>
    <g stroke="#3b6ea5" fill="none">
      <line x1="98" y1="55" x2="50" y2="90"/>
      <line x1="98" y1="55" x2="98" y2="90"/>
      <line x1="98" y1="55" x2="146" y2="90"/>
    </g>
    <circle cx="98" cy="55" r="6" fill="#3b6ea5"/>
    <circle cx="50" cy="90" r="5" fill="#8fb3d9"/>
    <circle cx="98" cy="90" r="5" fill="#8fb3d9"/>
    <circle cx="146" cy="90" r="5" fill="#8fb3d9"/>
    <!-- bar chart -->
    <rect x="194" y="10" width="176" height="92" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="204" y="24" font-size="9" fill="#444444">Clustered bars by Age Band</text>
    <g fill="#3b6ea5">
      <rect x="204" y="60" width="16" height="34"/><rect x="226" y="45" width="16" height="49"/>
      <rect x="248" y="70" width="16" height="24"/><rect x="270" y="50" width="16" height="44"/>
      <rect x="292" y="65" width="16" height="29"/><rect x="314" y="40" width="16" height="54"/>
    </g>
    <!-- key influencers -->
    <rect x="194" y="112" width="176" height="92" fill="#eef2f7" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="204" y="128" font-size="9" fill="#444444">Key Influencers</text>
    <text x="204" y="140" font-size="9" fill="#444444">"What drives net growth?"</text>
  </g>

  <!-- ===================== PAGE 4: COVID-19 Impact ===================== -->
  <g transform="translate(40,364)">
    <text x="0" y="-8" font-size="14" font-weight="700" fill="#1a1a1a">4. COVID-19 Impact</text>
    <rect x="0" y="0" width="380" height="214" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
    <!-- comparison KPIs -->
    <g fill="#e8e8e8" stroke="#999999" stroke-dasharray="3,2">
      <rect x="10" y="10" width="176" height="46"/>
      <rect x="194" y="10" width="176" height="46"/>
    </g>
    <text x="98" y="30" font-size="9" text-anchor="middle" fill="#444444">Pre-COVID Avg</text>
    <text x="98" y="42" font-size="9" text-anchor="middle" fill="#444444">Monthly Net Payroll</text>
    <text x="282" y="30" font-size="9" text-anchor="middle" fill="#444444">COVID-Era Avg</text>
    <text x="282" y="42" font-size="9" text-anchor="middle" fill="#444444">Monthly Net Payroll</text>
    <!-- zoomed trend with shaded region -->
    <rect x="10" y="64" width="360" height="100" fill="#ffffff" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="20" y="78" font-size="9" fill="#444444">Trend, zoomed to 2019-2021 (COVID window shaded)</text>
    <rect x="140" y="86" width="70" height="70" fill="#f3c6c6" opacity="0.6"/>
    <text x="145" y="98" font-size="8" fill="#7a2626">Mar-Aug 2020</text>
    <polyline points="20,140 60,130 100,120 140,150 175,155 210,110 250,100 290,95 340,85" fill="none" stroke="#3b6ea5" stroke-width="2"/>
    <!-- callout -->
    <rect x="10" y="172" width="360" height="32" fill="#eef2f7" stroke="#999999" stroke-dasharray="3,2"/>
    <text x="20" y="192" font-size="9" fill="#444444">Text callout: what the dip means, and the recovery</text>
  </g>

  <!-- ===================== PAGE 5: Methodology ===================== -->
  <g transform="translate(460,364)">
    <text x="0" y="-8" font-size="14" font-weight="700" fill="#1a1a1a">5. Methodology</text>
    <rect x="0" y="0" width="380" height="214" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
    <g fill="#eef2f7" stroke="#999999" stroke-dasharray="3,2">
      <rect x="10" y="10" width="360" height="42"/>
      <rect x="10" y="58" width="360" height="42"/>
      <rect x="10" y="106" width="360" height="42"/>
      <rect x="10" y="154" width="360" height="50"/>
    </g>
    <g font-size="9" fill="#444444">
      <text x="20" y="26">Data source: EPFO Provisional Estimate of Payroll</text>
      <text x="20" y="38">(epfo.gov.in/data-hub, + Wayback Machine recovery)</text>
      <text x="20" y="74">Refresh cadence: monthly, manual (drop new PDF in</text>
      <text x="20" y="86">data/raw, hit Refresh)</text>
      <text x="20" y="122">Known limitations: 1 file (2019-09) unparseable;</text>
      <text x="20" y="134">"provisional" figures get revised in later reports</text>
      <text x="20" y="170">Data model: star schema — PayrollMonthlyRaw (fact,</text>
      <text x="20" y="182">grain Month x AgeBand) + Calendar (date dimension)</text>
      <text x="20" y="194">See github repo for full documentation</text>
    </g>
  </g>

  <!-- ===================== Legend ===================== -->
  <g transform="translate(880,364)">
    <text x="0" y="-8" font-size="14" font-weight="700" fill="#1a1a1a">Legend</text>
    <rect x="0" y="0" width="380" height="214" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <g font-size="10" fill="#333333">
      <rect x="14" y="16" width="18" height="12" fill="#e8e8e8" stroke="#999999" stroke-dasharray="3,2"/>
      <text x="40" y="26">Placeholder for a visual/card (content TBD in build)</text>
      <rect x="14" y="40" width="18" height="12" fill="#eef2f7" stroke="#999999" stroke-dasharray="3,2"/>
      <text x="40" y="50">Placeholder for text/narrative content</text>
      <rect x="14" y="64" width="18" height="12" fill="#f3c6c6" opacity="0.6"/>
      <text x="40" y="74">Highlighted/annotated period (e.g. COVID window)</text>
      <line x1="14" y1="94" x2="32" y2="94" stroke="#3b6ea5" stroke-width="2"/>
      <text x="40" y="98">Primary measure line (Net Payroll)</text>
      <line x1="14" y1="112" x2="32" y2="112" stroke="#c0793b" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="40" y="116">Secondary/overlay measure (Rolling 3M Avg)</text>
    </g>
    <text x="0" y="150" font-size="10" fill="#666666">Not built yet — a plan to work from, not a screenshot.</text>
    <text x="0" y="166" font-size="10" fill="#666666">Update this file if the actual build ends up diverging</text>
    <text x="0" y="182" font-size="10" fill="#666666">from the plan (e.g. a page gets split, merged, dropped).</text>
  </g>
</svg>
