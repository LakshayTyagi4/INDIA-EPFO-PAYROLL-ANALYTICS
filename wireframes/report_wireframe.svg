<svg viewBox="0 0 1300 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a2540" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2454A8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2454A8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1300" height="700" fill="#eef1f6"/>

  <text x="40" y="34" font-size="23" font-weight="700" fill="#1a2540">EPFO Payroll Analytics — Report Wireframe</text>
  <text x="40" y="56" font-size="13" fill="#6b7280">Plan for the 5 report pages, sketched before the Power BI build — Phase 4 blueprint</text>

  <!-- ============================================================ PAGE 1: Overview ============================================================ -->
  <g transform="translate(40,86)">
    <rect x="0" y="0" width="380" height="228" rx="10" fill="#ffffff" stroke="#dde3ec" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="380" height="30" rx="10" fill="#2454A8"/>
    <rect x="0" y="14" width="380" height="16" fill="#2454A8"/>
    <circle cx="18" cy="15" r="9" fill="#ffffff" opacity="0.15"/>
    <text x="18" y="20" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="34" y="20" font-size="12" font-weight="700" fill="#ffffff">Overview</text>

    <!-- KPI cards -->
    <g>
      <rect x="12" y="40" width="84" height="50" rx="6" fill="#f4f6fa"/>
      <rect x="12" y="40" width="3" height="50" rx="1.5" fill="#2454A8"/>
      <rect x="105" y="40" width="84" height="50" rx="6" fill="#f4f6fa"/>
      <rect x="105" y="40" width="3" height="50" rx="1.5" fill="#3fa15e"/>
      <rect x="198" y="40" width="84" height="50" rx="6" fill="#f4f6fa"/>
      <rect x="198" y="40" width="3" height="50" rx="1.5" fill="#d98a3d"/>
      <rect x="291" y="40" width="84" height="50" rx="6" fill="#f4f6fa"/>
      <rect x="291" y="40" width="3" height="50" rx="1.5" fill="#2454A8"/>
    </g>
    <g font-size="8.5" fill="#6b7280">
      <text x="22" y="52">Latest Month</text>
      <rect x="22" y="58" width="52" height="12" rx="2" fill="#c9d3e2"/>
      <text x="115" y="52">MoM Change</text>
      <g transform="translate(115,60)"><polygon points="0,10 5,0 10,10" fill="#3fa15e"/></g>
      <rect x="130" y="58" width="40" height="12" rx="2" fill="#c9d3e2"/>
      <text x="208" y="52">YoY Change</text>
      <g transform="translate(208,60)"><polygon points="0,10 5,0 10,10" fill="#d98a3d"/></g>
      <rect x="223" y="58" width="40" height="12" rx="2" fill="#c9d3e2"/>
      <text x="301" y="52">All-Time High?</text>
      <rect x="301" y="58" width="60" height="12" rx="2" fill="#c9d3e2"/>
    </g>

    <!-- smart narrative -->
    <rect x="12" y="98" width="356" height="42" rx="6" fill="#f4f6fa"/>
    <circle cx="26" cy="112" r="6" fill="#2454A8" opacity="0.85"/>
    <text x="26" y="116" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="700">i</text>
    <text x="38" y="114" font-size="8.5" fill="#374151" font-weight="600">Smart Narrative</text>
    <rect x="38" y="120" width="320" height="6" rx="2" fill="#d7deea"/>
    <rect x="38" y="130" width="260" height="6" rx="2" fill="#d7deea"/>

    <!-- sparkline -->
    <rect x="12" y="148" width="356" height="68" rx="6" fill="#ffffff" stroke="#e5e9f0"/>
    <text x="22" y="162" font-size="8.5" fill="#6b7280">Net Payroll — full history</text>
    <polyline points="24,205 60,196 96,200 132,182 168,190 204,160 240,172 276,148 312,168 348,152"
      fill="none" stroke="#2454A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============================================================ PAGE 2: Trend ============================================================ -->
  <g transform="translate(460,86)">
    <rect x="0" y="0" width="380" height="228" rx="10" fill="#ffffff" stroke="#dde3ec" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="380" height="30" rx="10" fill="#2454A8"/>
    <rect x="0" y="14" width="380" height="16" fill="#2454A8"/>
    <text x="18" y="20" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="34" y="20" font-size="12" font-weight="700" fill="#ffffff">Trend</text>

    <!-- slicers -->
    <rect x="12" y="40" width="110" height="20" rx="10" fill="#e8edf5" stroke="#c9d3e2"/>
    <text x="67" y="53" font-size="8" fill="#374151" text-anchor="middle">Fiscal Year ▾</text>
    <rect x="130" y="40" width="110" height="20" rx="10" fill="#e8edf5" stroke="#c9d3e2"/>
    <text x="185" y="53" font-size="8" fill="#374151" text-anchor="middle">Age Band ▾</text>

    <!-- main chart -->
    <rect x="12" y="66" width="356" height="118" rx="6" fill="#ffffff" stroke="#e5e9f0"/>
    <text x="22" y="80" font-size="8.5" fill="#6b7280">Net Payroll (solid) + Rolling 3M Avg (dashed)</text>
    <line x1="30" y1="90" x2="30" y2="172" stroke="#d7deea"/>
    <line x1="30" y1="172" x2="358" y2="172" stroke="#d7deea"/>
    <line x1="30" y1="131" x2="358" y2="131" stroke="#eef1f6"/>
    <polygon points="30,172 60,150 90,158 120,120 150,105 180,128 210,90 240,105 270,80 300,95 330,70 358,85 358,172"
      fill="url(#areaFill)"/>
    <polyline points="30,172 60,150 90,158 120,120 150,105 180,128 210,90 240,105 270,80 300,95 330,70 358,85"
      fill="none" stroke="#2454A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="30,168 60,160 90,155 120,145 150,135 180,132 210,120 240,115 270,105 300,100 330,90 358,88"
      fill="none" stroke="#d98a3d" stroke-width="1.5" stroke-dasharray="5,3" stroke-linecap="round"/>

    <!-- KPI strip -->
    <rect x="12" y="192" width="172" height="30" rx="6" fill="#f4f6fa"/>
    <text x="22" y="203" font-size="7.5" fill="#6b7280">MoM %</text>
    <rect x="22" y="207" width="36" height="9" rx="2" fill="#c9d3e2"/>
    <rect x="196" y="192" width="172" height="30" rx="6" fill="#f4f6fa"/>
    <text x="206" y="203" font-size="7.5" fill="#6b7280">YoY %</text>
    <rect x="206" y="207" width="36" height="9" rx="2" fill="#c9d3e2"/>
  </g>

  <!-- ============================================================ PAGE 3: Age-Band Breakdown ============================================================ -->
  <g transform="translate(880,86)">
    <rect x="0" y="0" width="380" height="228" rx="10" fill="#ffffff" stroke="#dde3ec" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="380" height="30" rx="10" fill="#2454A8"/>
    <rect x="0" y="14" width="380" height="16" fill="#2454A8"/>
    <text x="18" y="20" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="34" y="20" font-size="12" font-weight="700" fill="#ffffff">Age-Band Breakdown</text>

    <!-- decomposition tree -->
    <rect x="12" y="40" width="172" height="176" rx="6" fill="#ffffff" stroke="#e5e9f0"/>
    <text x="22" y="54" font-size="8.5" fill="#6b7280">Decomposition Tree</text>
    <text x="22" y="65" font-size="7.5" fill="#9aa4b2">Total → Age Band → Month</text>
    <g stroke="#a9bcdc" stroke-width="1.4" fill="none">
      <line x1="98" y1="85" x2="45" y2="120"/>
      <line x1="98" y1="85" x2="98" y2="120"/>
      <line x1="98" y1="85" x2="151" y2="120"/>
      <line x1="45" y1="120" x2="30" y2="150"/>
      <line x1="45" y1="120" x2="55" y2="150"/>
    </g>
    <circle cx="98" cy="85" r="8" fill="#2454A8"/>
    <circle cx="45" cy="120" r="6" fill="#5a86c9"/>
    <circle cx="98" cy="120" r="6" fill="#5a86c9"/>
    <circle cx="151" cy="120" r="6" fill="#5a86c9"/>
    <circle cx="30" cy="150" r="4.5" fill="#a9bcdc"/>
    <circle cx="55" cy="150" r="4.5" fill="#a9bcdc"/>
    <text x="98" y="175" font-size="7" fill="#9aa4b2" text-anchor="middle">18-21, 22-25, 26-28...</text>

    <!-- bar chart -->
    <rect x="196" y="40" width="172" height="82" rx="6" fill="#ffffff" stroke="#e5e9f0"/>
    <text x="206" y="54" font-size="8.5" fill="#6b7280">Net Payroll by Age Band</text>
    <line x1="206" y1="110" x2="356" y2="110" stroke="#d7deea"/>
    <g fill="#2454A8">
      <rect x="210" y="80" width="15" height="30" rx="2"/>
      <rect x="233" y="65" width="15" height="45" rx="2"/>
      <rect x="256" y="88" width="15" height="22" rx="2"/>
      <rect x="279" y="72" width="15" height="38" rx="2"/>
      <rect x="302" y="83" width="15" height="27" rx="2"/>
      <rect x="325" y="60" width="15" height="50" rx="2"/>
    </g>

    <!-- key influencers -->
    <rect x="196" y="130" width="172" height="86" rx="6" fill="#f4f6fa"/>
    <text x="206" y="146" font-size="8.5" fill="#374151" font-weight="600">Key Influencers</text>
    <text x="206" y="159" font-size="7.5" fill="#6b7280">"What drives net growth?"</text>
    <g fill="#a9bcdc">
      <rect x="206" y="170" width="150" height="6" rx="2"/>
      <rect x="206" y="182" width="120" height="6" rx="2"/>
      <rect x="206" y="194" width="135" height="6" rx="2"/>
    </g>
  </g>

  <!-- ============================================================ PAGE 4: COVID-19 Impact ============================================================ -->
  <g transform="translate(40,332)">
    <rect x="0" y="0" width="380" height="228" rx="10" fill="#ffffff" stroke="#dde3ec" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="380" height="30" rx="10" fill="#b23b3b"/>
    <rect x="0" y="14" width="380" height="16" fill="#b23b3b"/>
    <text x="18" y="20" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="34" y="20" font-size="12" font-weight="700" fill="#ffffff">COVID-19 Impact</text>

    <!-- comparison KPIs -->
    <rect x="12" y="40" width="172" height="48" rx="6" fill="#f4f6fa"/>
    <rect x="12" y="40" width="3" height="48" fill="#2454A8"/>
    <text x="22" y="54" font-size="8" fill="#6b7280">Pre-COVID Avg / Month</text>
    <rect x="22" y="62" width="70" height="14" rx="2" fill="#c9d3e2"/>
    <rect x="196" y="40" width="172" height="48" rx="6" fill="#fbecec"/>
    <rect x="196" y="40" width="3" height="48" fill="#b23b3b"/>
    <text x="206" y="54" font-size="8" fill="#8a3d3d">COVID-Era Avg / Month</text>
    <rect x="206" y="62" width="70" height="14" rx="2" fill="#e6bcbc"/>

    <!-- zoomed trend -->
    <rect x="12" y="96" width="356" height="94" rx="6" fill="#ffffff" stroke="#e5e9f0"/>
    <text x="22" y="110" font-size="8.5" fill="#6b7280">Trend, zoomed to 2019-2021</text>
    <rect x="150" y="120" width="70" height="58" fill="#e57373" opacity="0.22"/>
    <line x1="150" y1="120" x2="150" y2="178" stroke="#b23b3b" stroke-dasharray="3,2"/>
    <line x1="220" y1="120" x2="220" y2="178" stroke="#b23b3b" stroke-dasharray="3,2"/>
    <text x="185" y="132" font-size="7" fill="#8a3d3d" text-anchor="middle" font-weight="600">Mar-Aug 2020</text>
    <line x1="24" y1="178" x2="350" y2="178" stroke="#d7deea"/>
    <polyline points="24,150 60,140 96,130 132,160 150,166 185,170 220,120 250,110 280,100 316,90 350,80"
      fill="none" stroke="#2454A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- callout -->
    <rect x="12" y="198" width="356" height="24" rx="6" fill="#fbecec"/>
    <circle cx="26" cy="210" r="6" fill="#b23b3b"/>
    <text x="26" y="214" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="700">!</text>
    <rect x="38" y="205" width="300" height="6" rx="2" fill="#e6bcbc"/>
    <text x="345" y="198" font-size="0"> </text>
  </g>

  <!-- ============================================================ PAGE 5: Methodology ============================================================ -->
  <g transform="translate(460,332)">
    <rect x="0" y="0" width="380" height="228" rx="10" fill="#ffffff" stroke="#dde3ec" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="380" height="30" rx="10" fill="#2454A8"/>
    <rect x="0" y="14" width="380" height="16" fill="#2454A8"/>
    <text x="18" y="20" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="34" y="20" font-size="12" font-weight="700" fill="#ffffff">Methodology</text>

    <g>
      <!-- row 1 -->
      <circle cx="24" cy="52" r="7" fill="#2454A8"/>
      <text x="24" y="56" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
      <text x="40" y="49" font-size="9" font-weight="600" fill="#374151">Data source</text>
      <text x="40" y="61" font-size="8" fill="#6b7280">EPFO data-hub + Wayback Machine recovery</text>

      <!-- row 2 -->
      <circle cx="24" cy="90" r="7" fill="#2454A8"/>
      <text x="24" y="94" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
      <text x="40" y="87" font-size="9" font-weight="600" fill="#374151">Refresh cadence</text>
      <text x="40" y="99" font-size="8" fill="#6b7280">Monthly, manual — drop new PDF, hit Refresh</text>

      <!-- row 3 -->
      <circle cx="24" cy="128" r="7" fill="#2454A8"/>
      <text x="24" y="132" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
      <text x="40" y="125" font-size="9" font-weight="600" fill="#374151">Known limitations</text>
      <text x="40" y="137" font-size="8" fill="#6b7280">1 file unparseable; provisional figures revised later</text>

      <!-- row 4 -->
      <circle cx="24" cy="166" r="7" fill="#2454A8"/>
      <text x="24" y="170" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
      <text x="40" y="163" font-size="9" font-weight="600" fill="#374151">Data model</text>
      <text x="40" y="175" font-size="8" fill="#6b7280">Star schema — fact (Month x AgeBand) + Calendar</text>

      <!-- row 5 -->
      <circle cx="24" cy="204" r="7" fill="#2454A8"/>
      <text x="24" y="208" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
      <text x="40" y="201" font-size="9" font-weight="600" fill="#374151">Full documentation</text>
      <text x="40" y="213" font-size="8" fill="#6b7280">See github.com/LakshayTyagi4/INDIA-EPFO-PAYROLL-ANALYTICS</text>
    </g>
  </g>

  <!-- ============================================================ Legend ============================================================ -->
  <g transform="translate(880,332)">
    <rect x="0" y="0" width="380" height="228" rx="10" fill="#ffffff" stroke="#dde3ec" filter="url(#cardShadow)"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#1a2540">Legend</text>

    <rect x="16" y="36" width="16" height="16" rx="4" fill="#f4f6fa"/>
    <rect x="16" y="36" width="3" height="16" fill="#2454A8"/>
    <text x="40" y="47" font-size="9" fill="#374151">KPI card (colored bar = accent, not meaning)</text>

    <line x1="16" y1="66" x2="32" y2="66" stroke="#2454A8" stroke-width="2.2"/>
    <text x="40" y="69" font-size="9" fill="#374151">Primary measure line (Net Payroll)</text>

    <line x1="16" y1="86" x2="32" y2="86" stroke="#d98a3d" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="40" y="89" font-size="9" fill="#374151">Secondary/overlay measure (Rolling 3M Avg)</text>

    <rect x="16" y="100" width="16" height="12" fill="#e57373" opacity="0.3"/>
    <text x="40" y="109" font-size="9" fill="#374151">Highlighted period (e.g. COVID window)</text>

    <circle cx="24" cy="128" r="7" fill="#2454A8"/>
    <text x="40" y="131" font-size="9" fill="#374151">Numbered step / methodology point</text>

    <rect x="16" y="145" width="150" height="6" rx="2" fill="#c9d3e2"/>
    <text x="176" y="151" font-size="9" fill="#374151">— placeholder for real text/value</text>

    <line x1="16" y1="176" x2="364" y2="176" stroke="#eef1f6"/>
    <text x="16" y="196" font-size="9.5" fill="#6b7280">A plan to build from, not a screenshot of the</text>
    <text x="16" y="212" font-size="9.5" fill="#6b7280">finished report — update this file if the actual</text>
    <text x="16" y="228" font-size="9.5" fill="#6b7280">build ends up diverging from the plan.</text>
  </g>
</svg>
